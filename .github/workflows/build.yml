name: Build Flutter Client
on:
  push:
    branches:
      - main
  release:
    types:
      - created
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android:
    name: G2W Monitor Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
      - name: Extract Build Info
        shell: bash
        run: |
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == "refs/tags/bleeding_edge" ]]; then
            echo "BUILD_NAME=3.0.0-bleeding_edge+${{ github.run_number }}" >> $GITHUB_ENV
          fi

      # We need to enforce java 17 because newer Flutter packages are
      # requiring this Java Version.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          check-latest: true
      - uses: subosito/flutter-action@v2.8.0
        with:
          channel: "stable"
          # cache: true
      # `secrets` isn't a valid context in `if:` (GitHub Actions
      # restriction) — guard in shell instead. Skipped on PRs from forks
      # (no secret access there), where build.gradle falls back to the
      # debug key as long as android/key.properties doesn't exist at all.
      - name: Create Key Store
        run: |
          if [ -n "$KEY_STORE" ]; then
            echo "$KEY_STORE" | base64 -d > android/app/keystore.jks
          fi
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
      - name: Create Key Properties
        run: |
          if [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEY_PROPERTIES" | base64 -d > android/key.properties
          fi
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
      - run: flutter gen-l10n
      - run: flutter pub get
      - run: flutter build apk --verbose --split-per-abi --build-number=${{ env.BUILD_NUMBER }} ${{ env.BUILD_NAME && format('--build-name={0}', env.BUILD_NAME) }}
      - run: flutter build appbundle --verbose --build-number=${{ env.BUILD_NUMBER }} ${{ env.BUILD_NAME && format('--build-name={0}', env.BUILD_NAME) }}
      - run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk g2w-monitor-android-arm64-v8a-release.apk
      - run: cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk g2w-monitor-android-armeabi-v7a-release.apk
      - run: cp build/app/outputs/flutter-apk/app-x86_64-release.apk g2w-monitor-android-x86_64-release.apk
      # Manual/workflow_dispatch runs (e.g. testing the locked-server-build
      # variant) don't match either "Release" step's condition below, so the
      # APKs would otherwise vanish with the runner. Upload them as a normal
      # workflow artifact too — doesn't touch the GitHub Release flow at all.
      - name: Upload APKs and AAB as workflow artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: g2w-monitor-android-apks
          path: |
            g2w-monitor-android-arm64-v8a-release.apk
            g2w-monitor-android-armeabi-v7a-release.apk
            g2w-monitor-android-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
      - name: Release
        # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-using-contexts
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: true
          body: ""
          tag_name: "bleeding_edge"
          files: |
            g2w-monitor-android-arm64-v8a-release.apk
            g2w-monitor-android-armeabi-v7a-release.apk
            g2w-monitor-android-x86_64-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-using-contexts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            g2w-monitor-android-arm64-v8a-release.apk
            g2w-monitor-android-armeabi-v7a-release.apk
            g2w-monitor-android-x86_64-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}

