name: Flutter Analysis
on:
  push:
    branches:
      - main
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

jobs:
  package-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
      - name: Install Flutter
        uses: subosito/flutter-action@v2.8.0
        with:
          channel: stable
          flutter-version: "3.44.8" # keep in sync with build.yml

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      # Deprecation notices (info) are reported but do not fail the job.
      - name: Run analysis
        run: flutter analyze --no-fatal-infos

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
      - name: Install Flutter
        uses: subosito/flutter-action@v2.8.0
        with:
          channel: stable
          flutter-version: "3.44.8" # keep in sync with build.yml

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter test
